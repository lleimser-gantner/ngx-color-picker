<color-preset [show-depth-title]="list().length > 1" [color]="list()[0]" [activeColor]="activeColor()" (longPress)="onLongPress()" (selectionChange)="onSelectionChange($event)" />
<div class="reflection" [style.backgroundColor]="list()[0].toRgbaString()"></div>
<div class="reflection" [style.backgroundColor]="list()[0].toRgbaString()"></div>

@if (showChildren()) {
    <div class="sublist animated">
        @for(preset of list(); track preset; let i = $index, isLast = $last, isFirst = $first) {
        <color-preset 
            [color]="preset"
            [activeColor]="activeColor()"
            (selectionChange)="onSelectionChange($event)"
            [class.first-preset]="isFirst"
            [class.last-preset]="isLast"
            [style.--i]="i" />
        }
    </div>
}
